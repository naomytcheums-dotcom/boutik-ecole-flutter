<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Boutik-École : la marketplace des créations, services et talents des étudiants de l’IUT de Douala.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Boutik-École">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Boutik-École · marketplace des étudiants de l’IUT de Douala</title>
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="https://boutik-ecole.vercel.app/">
  <meta name="theme-color" content="#111015">

  <!-- Aperçu lors d'un partage (WhatsApp, Facebook, LinkedIn, X) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Boutik-École">
  <meta property="og:title" content="Boutik-École · créations, services et talents des étudiants">
  <meta property="og:description" content="Achetez les créations des étudiants de l’IUT de Douala, commandez leurs services et découvrez leurs projets. Retrait au kiosque, paiement Mobile Money.">
  <meta property="og:url" content="https://boutik-ecole.vercel.app/">
  <meta property="og:image" content="https://boutik-ecole.vercel.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <noscript>
    <h1>Boutik-École</h1>
    <p>La marketplace des créations, services et talents des étudiants de l’IUT de Douala.
      Activez JavaScript pour utiliser l’application.</p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Écran d'attente affiché dès l'ouverture, retiré dès que l'application dessine sa première image. -->
  <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F7F6F4;font-family:system-ui,sans-serif;color:#111015;z-index:1">
    <div style="width:44px;height:44px;border:4px solid #E3E0EA;border-top-color:#111015;border-radius:50%;animation:bs 0.9s linear infinite"></div>
    <p style="margin-top:18px;font-size:15px;font-weight:600">Boutik-École</p>
    <p style="margin-top:4px;font-size:12.5px;color:#4A4854">Chargement…</p>
  </div>
  <style>@keyframes bs{to{transform:rotate(360deg)}}</style>
  <script>
    new MutationObserver(function (m, o) {
      if (document.querySelector('flutter-view, flt-glass-pane')) {
        setTimeout(function () { var b = document.getElementById('boot'); if (b) b.remove(); }, 400);
        o.disconnect();
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
